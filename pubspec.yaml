name: arcpdf
description: ArcPDF - premium local-first PDF manager and viewer.
publish_to: "none"
version: 1.0.17

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  pdfrx: ^1.0.103
  flutter_animate: ^4.5.0
  animations: ^2.0.11
  path_provider: ^2.1.5
  flutter_riverpod: ^2.5.1
  watcher: ^1.1.0
  flutter_staggered_grid_view: ^0.7.0
  scrollable_positioned_list: ^0.3.8
  flutter_svg: ^2.0.10+1
  hugeicons: ^0.0.7
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shimmer: ^3.0.0
  intl: ^0.19.0
  collection: ^1.18.0
  google_fonts: ^6.2.1
  lottie: ^3.1.2
  package_info_plus: ^8.1.2
  http: ^1.6.0
  url_launcher: ^6.3.2
  share_plus: ^10.1.3
  device_info_plus: ^10.1.0
  printing: ^5.14.3
  file_picker: ^11.0.2
  flutter_file_dialog: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  build_runner: ^2.4.13
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.14.4
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  assets:
    - assets/lottie/

flutter_launcher_icons:
  android: "ic_launcher"
  image_path: "assets/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#111111"
  adaptive_icon_foreground: "assets/icon.png"
