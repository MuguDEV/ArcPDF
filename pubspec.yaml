name: arcpdf
description: ArcPDF - premium local-first PDF manager and viewer.
publish_to: "none"
version: 1.0.2+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  pdfrx: ^1.0.103
  flex_color_scheme: ^8.1.0
  flutter_animate: ^4.5.0
  animations: ^2.0.11
  external_path: ^2.2.0
  path_provider: ^2.1.3
  permission_handler: ^11.3.1
  flutter_riverpod: ^2.5.1
  watcher: ^1.1.0
  flutter_staggered_grid_view: ^0.7.0
  scrollable_positioned_list: ^0.3.8
  flutter_svg: ^2.0.10+1
  hugeicons: ^0.0.7
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shimmer: ^3.0.0
  intl: ^0.19.0
  collection: ^1.18.0
  google_fonts: ^6.2.1
  lottie: ^3.1.2
  flutter_displaymode: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
