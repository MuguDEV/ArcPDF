name: Packaging validation
description: >
  Verifies the integrity of a packaging-compare artifact directory and runs the
  strict A/B validator on it. Needs no Flutter, Rust or signing secrets. The
  caller must check out the repository and download the artifact first.

inputs:
  dir:
    description: Directory holding the downloaded packaging-compare artifact
    required: false
    default: out
  expected-sha:
    description: Source commit the artifact must have been built from
    required: true
  expected-run-id:
    description: Workflow run id the artifact must have been built by
    required: true

runs:
  using: composite
  steps:
    - name: Install pinned Android build-tools and NDK
      shell: bash
      run: |
        set -euo pipefail
        # Installs only missing packages and exports the pinned build-tools path.
        ARCPDF_SKIP_PRECACHE=1 tool/setup_android_sdk.sh

    - name: Locate Android verification tools
      shell: bash
      run: |
        set -euo pipefail
        tools="$ARCPDF_BUILD_TOOLS_DIR"
        readelf="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
        missing=0
        for t in apksigner zipalign aapt2; do
          [[ -x "$tools/$t" ]] || { echo "::error::missing $tools/$t"; missing=1; }
        done
        [[ -x "$readelf" ]] || { echo "::error::llvm-readelf not found in NDK 28.2.13676358"; missing=1; }
        [[ "$missing" == 0 ]]
        echo "$(dirname "$readelf")" >> "$GITHUB_PATH"

    - name: Verify artifact provenance and integrity
      shell: bash
      env:
        DIR: ${{ inputs.dir }}
        EXPECTED_SHA: ${{ inputs.expected-sha }}
        EXPECTED_RUN_ID: ${{ inputs.expected-run-id }}
      run: |
        set -euo pipefail
        cd "$DIR"
        for f in provenance.txt SHA256SUMS build-start.txt; do
          [[ -f "$f" ]] || { echo "::error::artifact is missing $f"; exit 1; }
        done
        sha="$(sed -n 's/^sha=//p' provenance.txt)"
        if [[ "$sha" != "$EXPECTED_SHA" ]]; then
          echo "::error::artifact built from $sha, expected $EXPECTED_SHA"
          exit 1
        fi
        run_id="$(sed -n 's/^run_id=//p' provenance.txt)"
        if [[ "$run_id" != "$EXPECTED_RUN_ID" ]]; then
          echo "::error::artifact built by run $run_id, expected $EXPECTED_RUN_ID"
          exit 1
        fi
        # compare_aab is recorded by the build. Older artifacts lack the key:
        # then the aab directory decides.
        compare_aab="$(sed -n 's/^compare_aab=//p' provenance.txt)"
        if [[ -z "$compare_aab" ]]; then
          [[ -d aab ]] && compare_aab=true || compare_aab=false
        fi
        dirs=(A B)
        if [[ "$compare_aab" == "true" ]]; then
          dirs+=(aab)
        elif [[ -e aab ]]; then
          echo "::error::artifact contains aab files but provenance records compare_aab=false"
          exit 1
        fi
        sha256sum --check --strict SHA256SUMS
        # Nothing may exist in the artifact that the checksum list does not cover.
        listed="$(awk '{print $2}' SHA256SUMS | sed 's#^\./##' | sort)"
        actual="$(find "${dirs[@]}" -type f | sort)"
        if [[ "$listed" != "$actual" ]]; then
          echo "::error::artifact files differ from SHA256SUMS"
          diff <(echo "$listed") <(echo "$actual") || true
          exit 1
        fi

    - name: Unit tests for the packaging validator
      shell: bash
      run: python3 -m unittest discover -s tool/tests

    - name: Strict validation and report
      shell: bash
      env:
        DIR: ${{ inputs.dir }}
      run: |
        set -euo pipefail
        flags=()
        if grep -qx 'all_abis=true' "$DIR/provenance.txt"; then flags+=(--all-abis); fi
        aab_flags=()
        if [[ -d "$DIR/aab" ]]; then
          aab_flags+=(--aab-off "$DIR/aab/app-false.aab" --aab-on "$DIR/aab/app-true.aab")
        else
          echo "AAB comparison not requested (compare_aab=false)"
        fi
        status=0
        python3 tool/apk_packaging_report.py validate \
          --a-dir "$DIR/A" --b-dir "$DIR/B" "${flags[@]}" \
          --not-before "$(cat "$DIR/build-start.txt")" \
          "${aab_flags[@]}" \
          --json "$DIR/validation.json" --md "$DIR/report.md" || status=$?
        cat "$DIR/report.md" >> "$GITHUB_STEP_SUMMARY" || true
        exit "$status"
