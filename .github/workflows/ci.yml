name: CI

# Fast checks only: no release builds, no signing, no secrets.
# A "changes" job decides whether code jobs are needed. Docs-only and
# validator-only changes (tool/apk_packaging_*.py, tool/tests/**, packaging
# workflows and action) skip Flutter, Rust and Kotlin jobs. The python
# validator tests always run because they are cheap.

on:
  push:
    branches:
      - Main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Rust toolchain pin, shared with preview.yml, auto_release.yml and
  # packaging_compare.yml. Matches the compiler the lockfile was last built with.
  RUST_TOOLCHAIN: '1.92.0'

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: diff
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base=''
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            push) base="$PUSH_BEFORE" ;;
          esac
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "No usable base commit, running all jobs"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=false
          while IFS= read -r f; do
            case "$f" in
              docs/*|*.md|LICENSE|\
              tool/apk_packaging_*.py|tool/tests/*|\
              .github/workflows/packaging_compare.yml|\
              .github/workflows/packaging_validate.yml|\
              .github/actions/packaging-validate/*) ;;
              *) echo "code change: $f"; code=true ;;
            esac
          done < <(git diff --name-only "$base" "$HEAD_SHA")
          echo "code=$code" >> "$GITHUB_OUTPUT"

  analyze:
    name: Flutter analyze
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

  flutter-test:
    name: Flutter test
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Precache test fonts
        run: flutter precache --linux

      - name: Test
        run: flutter test

  rust-test:
    name: Rust test (native/arcpdf_indexer)
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/arcpdf_indexer
          shared-key: arcpdf-host-test
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/Main' }}

      - name: Cargo test
        working-directory: native/arcpdf_indexer
        run: cargo test --locked

  kotlin-build-logic-test:
    name: Kotlin buildSrc tests
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
          cache-read-only: ${{ github.ref != 'refs/heads/Main' }}

      - name: buildSrc unit tests
        run: gradle -p android/buildSrc test --no-daemon

  kotlin-app-test:
    name: Kotlin app unit tests
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Not yet run on GitHub. Informational until it has passed once.
    continue-on-error: true
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
          cache-read-only: ${{ github.ref != 'refs/heads/Main' }}

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Install Android platform and build-tools
        shell: bash
        run: |
          set -euo pipefail
          # Process substitution: a plain `yes | ...` pipe exits 141 (SIGPIPE) under pipefail.
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-36' 'build-tools;36.0.0' < <(yes) > /dev/null

      # The Rust indexer build is excluded: unit tests do not need native libraries.
      - name: App unit tests
        run: gradle -p android :app:testDebugUnitTest -x buildRustIndexer --no-daemon

  python-test:
    name: Python validator tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Unit tests
        run: python3 -m unittest discover -s tool/tests -v
