name: ArcPDF Release

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      version:
        description: 'Release latest'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Split APKs
        run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/app/outputs/symbols

      - name: Build AppBundle
        run: flutter build appbundle --release --obfuscate --split-debug-info=build/app/outputs/symbols

      - name: Rename & Organize Artifacts
        run: |
          mkdir -p release

          # Universal APK (if it exists, though split-per-abi usually replaces it, we'll copy it if present)
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-release.apk "release/ArcPDF-${{ github.event.inputs.version || github.ref_name }}-universal.apk"
          fi

          # Split APKs
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "release/ArcPDF-${{ github.event.inputs.version || github.ref_name }}-armeabi-v7a.apk" || true
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "release/ArcPDF-${{ github.event.inputs.version || github.ref_name }}-arm64-v8a.apk" || true
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk "release/ArcPDF-${{ github.event.inputs.version || github.ref_name }}-x86_64.apk" || true

          # App Bundle
          cp build/app/outputs/bundle/release/app-release.aab "release/ArcPDF-${{ github.event.inputs.version || github.ref_name }}.aab" || true

      - name: Create tag for manual release
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag ${{ github.event.inputs.version }}
          git push origin ${{ github.event.inputs.version }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: release/*

  release:
    name: Create GitHub Release
    needs: [build-android]
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create ArcPDF Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: ArcPDF ${{ github.event.inputs.version || github.ref_name }}
          files: "artifacts/*"
          generate_release_notes: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
