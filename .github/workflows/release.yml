name: ArcPDF Release

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      version:
        description: 'Release latest'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-android-linux:
    name: Build Android & Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake git ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Build Linux
        run: flutter build linux --release

      - name: Package Linux
        run: |
          cd build/linux/x64/release/bundle
          tar -czvf ArcPDF-Linux.tar.gz *
          cd ../../../../..

      - name: Rename & Organize Artifacts
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk "release/ArcPDF-${{ github.event.inputs.version || github.ref_name }}.apk"
          cp build/linux/x64/release/bundle/ArcPDF-Linux.tar.gz "release/ArcPDF-${{ github.event.inputs.version || github.ref_name }}-Linux.tar.gz"

      - name: Create tag for manual release
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag ${{ github.event.inputs.version }}
          git push origin ${{ github.event.inputs.version }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-linux-artifacts
          path: release/*

  build-ios-macos:
    name: Build iOS & macOS
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Package iOS IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r ArcPDF-iOS.ipa Payload
          rm -rf Payload

      - name: Build macOS
        run: flutter build macos --release

      - name: Package macOS
        run: |
          cd build/macos/Build/Products/Release
          zip -r ArcPDF-macOS.zip arcpdf.app
          cd ../../../../..

      - name: Rename & Organize Artifacts
        run: |
          mkdir -p release
          cp ArcPDF-iOS.ipa "release/ArcPDF-${{ github.event.inputs.version || github.ref_name }}-iOS.ipa"
          cp build/macos/Build/Products/Release/ArcPDF-macOS.zip "release/ArcPDF-${{ github.event.inputs.version || github.ref_name }}-macOS.zip"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-macos-artifacts
          path: release/*

  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Package Windows
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath ArcPDF-Windows.zip

      - name: Rename & Organize Artifacts
        shell: bash
        run: |
          mkdir -p release
          cp ArcPDF-Windows.zip "release/ArcPDF-${{ github.event.inputs.version || github.ref_name }}-Windows.zip"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: release/*

  release:
    name: Create GitHub Release
    needs: [build-android-linux, build-ios-macos, build-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create ArcPDF Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: ArcPDF ${{ github.event.inputs.version || github.ref_name }}
          files: "artifacts/*"
          generate_release_notes: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
