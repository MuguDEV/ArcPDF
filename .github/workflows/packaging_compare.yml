name: Packaging comparison (experimental)

# Builds the same commit twice, with modern (A) and compressed (B) native
# library packaging, and uploads a comparison report. Non-publishing: no
# release, no tags, no secrets. Both builds are signed with the same throwaway
# keystore generated at run time, so the signing identity never matches
# production and these APKs must not be distributed.

on:
  workflow_dispatch:
    inputs:
      all_abis:
        description: Build all ABIs (arm, arm64, x64) per-ABI plus universal instead of ARM64 only
        required: false
        default: false
        type: boolean
  pull_request:
    paths:
      - 'android/app/build.gradle.kts'
      - 'android/gradle.properties'
      - 'android/app/src/main/AndroidManifest.xml'
      - 'tool/apk_packaging_report.py'
      - 'tool/apk_packaging_validate.py'
      - 'tool/tests/**'
      - '.github/workflows/packaging_compare.yml'

permissions:
  contents: read

concurrency:
  group: packaging-compare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    name: Build A (modern) and B (compressed)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Rust Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/arcpdf_indexer

      - name: Install SDK packages and dependencies
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter precache --android
          sdkmanager --install \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;28.2.13676358'

      - name: Check required Android verification tools
        shell: bash
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/36.0.0"
          missing=0
          for t in apksigner zipalign aapt2; do
            [[ -x "$tools/$t" ]] || { echo "::error::missing $tools/$t"; missing=1; }
          done
          readelf="$(ls "$ANDROID_HOME"/ndk/*/toolchains/llvm/prebuilt/*/bin/llvm-readelf 2>/dev/null | tail -n 1 || true)"
          [[ -n "$readelf" ]] || { echo "::error::llvm-readelf not found in the NDK"; missing=1; }
          [[ "$missing" == 0 ]]
          echo "$tools" >> "$GITHUB_PATH"
          echo "$(dirname "$readelf")" >> "$GITHUB_PATH"

      - name: Unit tests for the packaging validator
        shell: bash
        run: python3 -m unittest discover -s tool/tests -v

      - name: Create throwaway signing key
        shell: bash
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/compare.jks"
          pass="$(openssl rand -hex 16)"
          echo "::add-mask::$pass"
          keytool -genkeypair -keystore "$keystore" -storepass "$pass" \
            -keypass "$pass" -alias compare -keyalg RSA -keysize 2048 \
            -validity 2 -dname 'CN=ArcPDF packaging comparison'
          {
            echo "ARCPDF_KEYSTORE_PATH=$keystore"
            echo "ARCPDF_STORE_PASSWORD=$pass"
            echo "ARCPDF_KEY_ALIAS=compare"
            echo "ARCPDF_KEY_PASSWORD=$pass"
          } >> "$GITHUB_ENV"

      - name: Build variants
        shell: bash
        env:
          ALL_ABIS: ${{ inputs.all_abis }}
        run: |
          set -euo pipefail

          # Stale output guard: nothing from a previous build may survive.
          rm -rf build/app/outputs out
          mkdir -p out/A out/B out/aab
          date +%s > out/build-start.txt
          sleep 1

          if [[ "$ALL_ABIS" == "true" ]]; then
            platforms='android-arm,android-arm64,android-x64'
            abis='armeabi-v7a,arm64-v8a,x86_64'
          else
            platforms='android-arm64'
            abis='arm64-v8a'
          fi
          # Keep the Gradle Rust/PDFium build in line with --target-platform.
          export ARCPDF_ABIS="$abis"

          build_apks() {
            label="$1"; compress="$2"
            rm -rf build/app/outputs/flutter-apk
            ARCPDF_COMPRESS_NATIVE_LIBS="$compress" flutter build apk \
              --release --split-per-abi \
              --target-platform "$platforms" \
              --build-name=0.0.0-compare \
              --build-number=1 \
              --obfuscate \
              --split-debug-info="build/symbols/$label"
            cp -p build/app/outputs/flutter-apk/app-*-release.apk "out/$label/"
          }

          build_universal() {
            label="$1"; compress="$2"
            rm -rf build/app/outputs/flutter-apk
            ARCPDF_COMPRESS_NATIVE_LIBS="$compress" flutter build apk --release \
              --target-platform "$platforms" \
              --build-name=0.0.0-compare --build-number=1 \
              --obfuscate --split-debug-info="build/symbols/$label-universal"
            cp -p build/app/outputs/flutter-apk/app-release.apk \
              "out/$label/app-universal-release.apk"
          }

          build_apks A false
          build_apks B true
          if [[ "$ALL_ABIS" == "true" ]]; then
            build_universal A false
            build_universal B true
          fi

      - name: Build AABs with the switch off and on
        shell: bash
        run: |
          set -euo pipefail
          # Matches --target-platform android-arm64 below.
          export ARCPDF_ABIS=arm64-v8a
          for compress in false true; do
            rm -rf build/app/outputs/bundle
            ARCPDF_COMPRESS_NATIVE_LIBS="$compress" flutter build appbundle --release \
              --target-platform android-arm64 \
              --build-name=0.0.0-compare --build-number=1 \
              --obfuscate --split-debug-info="build/symbols/aab-$compress"
            cp -p build/app/outputs/bundle/release/app-release.aab "out/aab/app-$compress.aab"
          done

      - name: Strict validation and report
        shell: bash
        env:
          ALL_ABIS: ${{ inputs.all_abis }}
        run: |
          set -euo pipefail
          flags=()
          if [[ "$ALL_ABIS" == "true" ]]; then flags+=(--all-abis); fi
          status=0
          python3 tool/apk_packaging_report.py validate \
            --a-dir out/A --b-dir out/B "${flags[@]}" \
            --not-before "$(cat out/build-start.txt)" \
            --aab-off out/aab/app-false.aab --aab-on out/aab/app-true.aab \
            --json out/validation.json --md out/report.md || status=$?
          cat out/report.md >> "$GITHUB_STEP_SUMMARY" || true
          exit "$status"

      - name: Upload comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaging-compare
          path: |
            out/**
          if-no-files-found: warn
          retention-days: 7
