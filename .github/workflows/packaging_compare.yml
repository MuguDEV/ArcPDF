name: Packaging comparison (experimental)

# Builds the same commit twice, with modern (A) and compressed (B) native
# library packaging, then validates the result in a separate job. ARM64 only by
# default; all_abis adds the other ABIs and universal APKs; compare_aab adds the
# AAB comparison. The build job uploads the APKs (and AABs) with provenance and
# checksums, so a failed validation job can be re-run alone without recompiling.
# After a validator-only change, use packaging_validate.yml with the run id of
# an earlier successful build instead of rebuilding. Non-publishing: no
# release, no tags, no secrets. Both builds are signed with the same throwaway
# keystore generated at run time, so the signing identity never matches
# production and these APKs must not be distributed.

on:
  workflow_dispatch:
    inputs:
      all_abis:
        description: Build all ABIs (arm, arm64, x64) per-ABI plus universal instead of ARM64 only
        required: false
        default: false
        type: boolean
      compare_aab:
        description: Also build and compare AABs (ARM64) with the switch off and on
        required: false
        default: false
        type: boolean
  # Only files that change what gets compiled or packaged. Validation-only files
  # (tool/apk_packaging_*.py, tool/tests/**, docs/**, the validate workflow and
  # action) are deliberately absent so they never trigger a compilation.
  pull_request:
    paths:
      - 'android/app/build.gradle.kts'
      - 'android/buildSrc/**'
      - 'android/gradle.properties'
      - 'android/app/src/main/AndroidManifest.xml'
      - 'native/arcpdf_indexer/**'
      - 'tool/build_android.sh'
      - 'tool/setup_android_sdk.sh'
      - 'tool/ci_gradle_workers.sh'
      - '.github/workflows/packaging_compare.yml'

permissions:
  contents: read

concurrency:
  group: packaging-compare-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: '1.92.0'

jobs:
  build:
    name: Build packaging variants
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/Main' }}

      # ARM64 comparisons install only aarch64-linux-android.
      - name: Install Rust Android targets
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ inputs.all_abis && 'aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android' || 'aarch64-linux-android' }}

      - name: Cache Rust (arm64)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/arcpdf_indexer -> ../../.arc-build/cargo-target/aarch64-linux-android
          shared-key: arcpdf-arm64
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/Main' }}

      - name: Cache Rust (armv7)
        if: ${{ inputs.all_abis }}
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/arcpdf_indexer -> ../../.arc-build/cargo-target/armv7-linux-androideabi
          shared-key: arcpdf-armv7
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/Main' }}

      - name: Cache Rust (x64)
        if: ${{ inputs.all_abis }}
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/arcpdf_indexer -> ../../.arc-build/cargo-target/x86_64-linux-android
          shared-key: arcpdf-x64
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/Main' }}

      - name: Install dependencies and Android SDK
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          tool/setup_android_sdk.sh
          tool/ci_gradle_workers.sh

      - name: Check required Android verification tools
        shell: bash
        run: |
          set -euo pipefail
          tools="$ARCPDF_BUILD_TOOLS_DIR"
          missing=0
          for t in apksigner zipalign aapt2; do
            [[ -x "$tools/$t" ]] || { echo "::error::missing $tools/$t"; missing=1; }
          done
          readelf="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          [[ -x "$readelf" ]] || { echo "::error::llvm-readelf not found in NDK 28.2.13676358"; missing=1; }
          [[ "$missing" == 0 ]]
          echo "$(dirname "$readelf")" >> "$GITHUB_PATH"

      - name: Create throwaway signing key
        shell: bash
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/compare.jks"
          pass="$(openssl rand -hex 16)"
          echo "::add-mask::$pass"
          keytool -genkeypair -keystore "$keystore" -storepass "$pass" \
            -keypass "$pass" -alias compare -keyalg RSA -keysize 2048 \
            -validity 2 -dname 'CN=ArcPDF packaging comparison'
          {
            echo "ARCPDF_KEYSTORE_PATH=$keystore"
            echo "ARCPDF_STORE_PASSWORD=$pass"
            echo "ARCPDF_KEY_ALIAS=compare"
            echo "ARCPDF_KEY_PASSWORD=$pass"
          } >> "$GITHUB_ENV"

      - name: Build variants
        shell: bash
        env:
          ALL_ABIS: ${{ inputs.all_abis }}
        run: |
          set -euo pipefail

          # Stale output guard: nothing from a previous build may survive.
          rm -rf build/app/outputs out
          mkdir -p out/A out/B out/aab
          date +%s > out/build-start.txt
          sleep 1

          if [[ "$ALL_ABIS" == "true" ]]; then
            platforms='android-arm,android-arm64,android-x64'
            abis='armeabi-v7a,arm64-v8a,x86_64'
          else
            platforms='android-arm64'
            abis='arm64-v8a'
          fi
          # Keep the Gradle Rust/PDFium build in line with --target-platform.
          export ARCPDF_ABIS="$abis"

          build_apks() {
            label="$1"; compress="$2"
            rm -rf build/app/outputs/flutter-apk
            ARCPDF_COMPRESS_NATIVE_LIBS="$compress" flutter build apk \
              --release --split-per-abi \
              --target-platform "$platforms" \
              --build-name=0.0.0-compare \
              --build-number=1 \
              --obfuscate \
              --split-debug-info="build/symbols/$label"
            cp -p build/app/outputs/flutter-apk/app-*-release.apk "out/$label/"
          }

          build_universal() {
            label="$1"; compress="$2"
            rm -rf build/app/outputs/flutter-apk
            ARCPDF_COMPRESS_NATIVE_LIBS="$compress" flutter build apk --release \
              --target-platform "$platforms" \
              --build-name=0.0.0-compare --build-number=1 \
              --obfuscate --split-debug-info="build/symbols/$label-universal"
            cp -p build/app/outputs/flutter-apk/app-release.apk \
              "out/$label/app-universal-release.apk"
          }

          build_apks A false
          build_apks B true
          if [[ "$ALL_ABIS" == "true" ]]; then
            build_universal A false
            build_universal B true
          fi

      - name: Build AABs with the switch off and on
        if: ${{ inputs.compare_aab }}
        shell: bash
        run: |
          set -euo pipefail
          # Matches --target-platform android-arm64 below.
          export ARCPDF_ABIS=arm64-v8a
          for compress in false true; do
            rm -rf build/app/outputs/bundle
            ARCPDF_COMPRESS_NATIVE_LIBS="$compress" flutter build appbundle --release \
              --target-platform android-arm64 \
              --build-name=0.0.0-compare --build-number=1 \
              --obfuscate --split-debug-info="build/symbols/aab-$compress"
            cp -p build/app/outputs/bundle/release/app-release.aab "out/aab/app-$compress.aab"
          done

      - name: Record provenance and checksums
        shell: bash
        env:
          ALL_ABIS: ${{ inputs.all_abis }}
          COMPARE_AAB: ${{ inputs.compare_aab }}
        run: |
          set -euo pipefail
          {
            echo "sha=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "all_abis=$([[ "$ALL_ABIS" == "true" ]] && echo true || echo false)"
            echo "compare_aab=$([[ "$COMPARE_AAB" == "true" ]] && echo true || echo false)"
          } > out/provenance.txt
          dirs=(A B)
          [[ "$COMPARE_AAB" == "true" ]] && dirs+=(aab)
          (cd out && find "${dirs[@]}" -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)

      - name: Upload build output
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: packaging-compare
          path: out/**
          if-no-files-found: error
          retention-days: 7

  validate:
    name: Strict validation
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    # Re-run this job alone ("Re-run failed jobs") to validate again without a rebuild.

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify artifact identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]] || { echo "::error::build job did not output an artifact id"; exit 1; }
          info="$(gh api "repos/$REPO/actions/artifacts/$ARTIFACT_ID")"
          [[ "$(jq -r .name <<<"$info")" == "packaging-compare" ]] || { echo "::error::unexpected artifact name"; exit 1; }
          [[ "$(jq -r .expired <<<"$info")" == "false" ]] || { echo "::error::artifact expired"; exit 1; }
          [[ "$(jq -r .workflow_run.id <<<"$info")" == "$RUN_ID" ]] || { echo "::error::artifact belongs to another run"; exit 1; }

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          merge-multiple: true
          path: out

      - name: Validate
        uses: ./.github/actions/packaging-validate
        with:
          dir: out
          expected-sha: ${{ github.sha }}
          expected-run-id: ${{ github.run_id }}

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaging-validation-report
          path: |
            out/validation.json
            out/report.md
          if-no-files-found: warn
          retention-days: 7
