name: Packaging comparison (experimental)

# Builds the same commit twice, with modern (A) and compressed (B) native
# library packaging, and uploads a comparison report. Non-publishing: no
# release, no tags, no secrets. Both builds are signed with the same throwaway
# keystore generated at run time, so the signing identity never matches
# production and these APKs must not be distributed.

on:
  workflow_dispatch:
    inputs:
      all_abis:
        description: Build all ABIs (arm, arm64, x64) per-ABI plus universal instead of ARM64 only
        required: false
        default: false
        type: boolean
  pull_request:
    paths:
      - 'android/app/build.gradle.kts'
      - 'android/gradle.properties'
      - 'android/app/src/main/AndroidManifest.xml'
      - 'tool/apk_packaging_report.py'
      - '.github/workflows/packaging_compare.yml'

permissions:
  contents: read

concurrency:
  group: packaging-compare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    name: Build A (modern) and B (compressed)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Rust Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/arcpdf_indexer

      - name: Install SDK packages and dependencies
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter precache --android
          sdkmanager --install \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;28.2.13676358'

      - name: Create throwaway signing key
        shell: bash
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/compare.jks"
          pass="$(openssl rand -hex 16)"
          echo "::add-mask::$pass"
          keytool -genkeypair -keystore "$keystore" -storepass "$pass" \
            -keypass "$pass" -alias compare -keyalg RSA -keysize 2048 \
            -validity 2 -dname 'CN=ArcPDF packaging comparison'
          {
            echo "ARCPDF_KEYSTORE_PATH=$keystore"
            echo "ARCPDF_STORE_PASSWORD=$pass"
            echo "ARCPDF_KEY_ALIAS=compare"
            echo "ARCPDF_KEY_PASSWORD=$pass"
          } >> "$GITHUB_ENV"

      - name: Build variants
        shell: bash
        env:
          ALL_ABIS: ${{ inputs.all_abis }}
        run: |
          set -euo pipefail

          if [[ "$ALL_ABIS" == "true" ]]; then
            platforms='android-arm,android-arm64,android-x64'
            split_flag='--split-per-abi'
          else
            platforms='android-arm64'
            split_flag='--split-per-abi'
          fi

          build() {
            label="$1"; compress="$2"
            ARCPDF_COMPRESS_NATIVE_LIBS="$compress" flutter build apk \
              --release $split_flag \
              --target-platform "$platforms" \
              --build-name=0.0.0-compare \
              --build-number=1 \
              --obfuscate \
              --split-debug-info="build/symbols/$label"
            mkdir -p "out/$label"
            cp build/app/outputs/flutter-apk/app-*-release.apk "out/$label/"
          }

          build A false
          build B true

          if [[ "$ALL_ABIS" == "true" ]]; then
            for label in A B; do
              ARCPDF_COMPRESS_NATIVE_LIBS="$([[ $label == B ]] && echo true || echo false)" \
                flutter build apk --release \
                --target-platform "$platforms" \
                --build-name=0.0.0-compare --build-number=1 \
                --obfuscate --split-debug-info="build/symbols/$label-universal"
              cp build/app/outputs/flutter-apk/app-release.apk \
                "out/$label/app-universal-release.apk"
            done
          fi

      - name: Check the AAB ignores the compression switch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/aab
          for compress in false true; do
            ARCPDF_COMPRESS_NATIVE_LIBS="$compress" flutter build appbundle --release \
              --target-platform android-arm64 \
              --build-name=0.0.0-compare --build-number=1 \
              --obfuscate --split-debug-info="build/symbols/aab-$compress"
            unzip -p build/app/outputs/bundle/release/app-release.aab \
              BundleConfig.pb > "out/aab/BundleConfig-$compress.pb"
          done
          cmp out/aab/BundleConfig-false.pb out/aab/BundleConfig-true.pb
          echo "BundleConfig.pb identical with and without the switch" | tee out/aab/result.txt

      - name: Report
        shell: bash
        run: |
          set -euo pipefail
          : > out/report.md
          for apk in out/A/*.apk out/B/*.apk; do
            python3 tool/apk_packaging_report.py "$apk" --out "$apk.md" > /dev/null
            echo "## $apk" >> out/report.md
            cat "$apk.md" >> out/report.md
          done
          cat out/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on invalid signature or misalignment
        shell: bash
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/36.0.0"
          for apk in out/A/*.apk out/B/*.apk; do
            "$tools/apksigner" verify --verbose "$apk"
          done
          # Stored libraries must be 16 KB aligned. Compressed libraries are
          # skipped by zipalign; their ELF p_align is listed in the report.
          for apk in out/A/*.apk; do
            "$tools/zipalign" -c -P 16 -v 4 "$apk"
          done
          for apk in out/B/*.apk; do
            "$tools/zipalign" -c -P 16 -v 4 "$apk" || \
              echo "::warning::zipalign reported issues for $apk (see report)"
          done

      - name: Upload comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaging-compare
          path: |
            out/**
          if-no-files-found: warn
          retention-days: 7
