
name: ArcPDF Auto Release

on:
  push:
    branches:
      - Main

  workflow_dispatch:
    inputs:
      bump_type:
        description: Version bump type
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: arcpdf-release
  cancel-in-progress: false

jobs:
  build-release:
    name: Build and Release ArcPDF
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Rust ARM64
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/arcpdf_indexer

      - name: Determine version and release tag
        id: version
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BUMP: ${{ inputs.bump_type }}
          RUN: ${{ github.run_number }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import pathlib
          import re

          path = pathlib.Path("pubspec.yaml")
          content = path.read_text()

          match = re.search(
              r"(?m)^version:\s*(\d+)\.(\d+)\.(\d+)(?:\+\d+)?$",
              content,
          )

          if not match:
              raise SystemExit("Invalid pubspec version")

          major, minor, patch = map(int, match.groups())

          manual = os.environ["EVENT"] == "workflow_dispatch"

          if manual:
              bump = os.environ["BUMP"]

              if bump == "major":
                  major += 1
                  minor = 0
                  patch = 0
              elif bump == "minor":
                  minor += 1
                  patch = 0
              elif bump == "patch":
                  patch += 1
              else:
                  raise SystemExit("Invalid bump type")

          version = f"{major}.{minor}.{patch}"

          if manual:
              tag = f"v{version}"
              updated = (
                  content[:match.start()]
                  + f"version: {version}"
                  + content[match.end():]
              )
              path.write_text(updated)
          else:
              tag = f"v{version}-build.{os.environ['RUN']}"

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\n")
              output.write(f"tag={tag}\n")

          print("Version:", version)
          print("Tag:", tag)
          PY

          TAG="${{ steps.version.outputs.tag }}"

          if git ls-remote --exit-code --tags origin \
            "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Release tag already exists: $TAG"
            exit 1
          fi

      - name: Install Flutter dependencies
        run: |
          set -euo pipefail
          flutter pub get

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail

          flutter precache --android

          sdkmanager --install \
            "platform-tools" \
            "ndk;28.2.13676358"

          echo "Android SDK: $ANDROID_HOME"
          ls "$ANDROID_HOME/ndk"

          cargo metadata \
            --locked \
            --format-version 1 \
            --no-deps \
            --manifest-path native/arcpdf_indexer/Cargo.toml \
            > /dev/null

          rustup target list --installed

      - name: Configure production signing
        shell: bash
        env:
          B64: ${{ secrets.ARCPDF_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ARCPDF_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ARCPDF_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ARCPDF_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for var in B64 STORE_PASS ALIAS KEY_PASS; do
            if [ -z "${!var}" ]; then
              echo "::error::Missing signing secret: $var"
              exit 1
            fi
          done

          printf '%s' "$B64" | base64 --decode \
            > "$RUNNER_TEMP/arcpdf-release.jks"

          test -s "$RUNNER_TEMP/arcpdf-release.jks"

          keytool -list \
            -keystore "$RUNNER_TEMP/arcpdf-release.jks" \
            -storepass "$STORE_PASS" \
            -alias "$ALIAS" > /dev/null

          echo "::add-mask::$STORE_PASS"
          echo "::add-mask::$KEY_PASS"

          {
            echo "ARCPDF_KEYSTORE_PATH=$RUNNER_TEMP/arcpdf-release.jks"
            echo "ARCPDF_STORE_PASSWORD=$STORE_PASS"
            echo "ARCPDF_KEY_ALIAS=$ALIAS"
            echo "ARCPDF_KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"

      - name: Build signed ARM64 APK
        shell: bash
        run: |
          set -euo pipefail

          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --build-name="${{ steps.version.outputs.version }}" \
            --build-number="${{ github.run_number }}" \
            --obfuscate \
            --split-debug-info=build/symbols

      - name: Build signed Android App Bundle
        shell: bash
        run: |
          set -euo pipefail

          flutter build appbundle \
            --release \
            --target-platform android-arm64 \
            --build-name="${{ steps.version.outputs.version }}" \
            --build-number="${{ github.run_number }}" \
            --obfuscate \
            --split-debug-info=build/symbols

      - name: Verify native libraries
        shell: bash
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"
          AAB="build/app/outputs/bundle/release/app-release.aab"

          test -s "$APK"
          test -s "$AAB"

          unzip -Z1 "$APK" > apk-contents.txt

          grep -Fx \
            "lib/arm64-v8a/libarcpdf_indexer.so" \
            apk-contents.txt

          grep -Fx \
            "lib/arm64-v8a/libpdfium.so" \
            apk-contents.txt

          grep -Fx \
            "lib/arm64-v8a/libflutter.so" \
            apk-contents.txt

          echo "Rust, PDFium and Flutter libraries verified."

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -name apksigner -type f | sort -V | tail -1)

          test -n "$APKSIGNER"

          "$APKSIGNER" verify --verbose "$APK"

          echo "APK signature verified."

      - name: Prepare release artifacts
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ steps.version.outputs.tag }}"

          mkdir -p release

          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            "release/ArcPDF-${TAG}-arm64-v8a.apk"

          cp \
            build/app/outputs/bundle/release/app-release.aab \
            "release/ArcPDF-${TAG}.aab"

          cd release
          sha256sum *.apk *.aab > SHA256SUMS.txt

          ls -lh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ArcPDF-${{ steps.version.outputs.tag }}
          path: |
            release/*
            build/symbols/**
          if-no-files-found: error
          retention-days: 30

      - name: Save manually bumped version
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add pubspec.yaml
          git commit -m \
            "chore: release ${{ steps.version.outputs.tag }} [skip ci]"

          git push origin HEAD:Main

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: Main
          name: ArcPDF ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          make_latest: ${{ github.event_name == 'workflow_dispatch' }}
          files: release/*
