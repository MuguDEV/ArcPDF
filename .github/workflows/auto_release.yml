
name: ArcPDF Release

on:
  push:
    branches:
      - Main

  workflow_dispatch:
    inputs:
      bump_type:
        description: Version bump type
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: arcpdf-auto-release
  cancel-in-progress: false

jobs:
  build-release:
    name: Build and publish ARM64 release
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Rust ARM64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/arcpdf_indexer

      - name: Determine version
        id: version
        shell: bash
        env:
          TRIGGER: ${{ github.event_name }}
          BUMP_TYPE: ${{ inputs.bump_type }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import pathlib
          import re

          file = pathlib.Path('pubspec.yaml')
          source = file.read_text()

          match = re.search(
              r'(?m)^version:\s*(\d+)\.(\d+)\.(\d+)(?:\+\d+)?\s*$',
              source
          )

          if not match:
              raise SystemExit('Invalid pubspec version')

          major, minor, patch = map(int, match.groups())
          manual = os.environ['TRIGGER'] == 'workflow_dispatch'

          if manual:
              bump = os.environ['BUMP_TYPE']

              if bump == 'major':
                  major, minor, patch = major + 1, 0, 0
              elif bump == 'minor':
                  minor, patch = minor + 1, 0
              elif bump == 'patch':
                  patch += 1
              else:
                  raise SystemExit('Invalid bump type')

          version = f'{major}.{minor}.{patch}'

          if manual:
              tag = f'v{version}'
              file.write_text(
                  source[:match.start()]
                  + f'version: {version}'
                  + source[match.end():]
              )
          else:
              tag = (
                  f"v{version}-build."
                  f"{os.environ['RUN_NUMBER']}"
              )

          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'version={version}\n')
              out.write(f'tag={tag}\n')

          pathlib.Path('release-tag.txt').write_text(tag)
          print(f'Release: {tag}')
          PY

          tag="$(cat release-tag.txt)"

          if git ls-remote --tags origin \
            "refs/tags/$tag" | \
            grep -Fq "refs/tags/$tag"; then
            echo "::error::Tag already exists"
            exit 1
          fi

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Install Android SDK packages and NDK
        shell: bash
        run: |
          set -euo pipefail

          flutter precache --android

          sdkmanager --install \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;28.2.13676358'

          sdkmanager --list_installed

          cargo metadata \
            --locked \
            --format-version 1 \
            --no-deps \
            --manifest-path native/arcpdf_indexer/Cargo.toml \
            > /dev/null

          rustup target list --installed

      - name: Configure production signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ARCPDF_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ARCPDF_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ARCPDF_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ARCPDF_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for key in KEYSTORE_B64 STORE_PASS KEY_ALIAS KEY_PASS; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing secret: $key"
              exit 1
            fi
          done

          printf '%s' "$KEYSTORE_B64" | base64 --decode \
            > "$RUNNER_TEMP/arcpdf-release.jks"

          test -s "$RUNNER_TEMP/arcpdf-release.jks"

          keytool -list \
            -keystore "$RUNNER_TEMP/arcpdf-release.jks" \
            -storepass "$STORE_PASS" \
            -alias "$KEY_ALIAS" > /dev/null

          echo "::add-mask::$STORE_PASS"
          echo "::add-mask::$KEY_PASS"

          {
            echo "ARCPDF_KEYSTORE_PATH=$RUNNER_TEMP/arcpdf-release.jks"
            echo "ARCPDF_STORE_PASSWORD=$STORE_PASS"
            echo "ARCPDF_KEY_ALIAS=$KEY_ALIAS"
            echo "ARCPDF_KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"

      - name: Build signed ARM64 APK
        run: |
          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --build-name='${{ steps.version.outputs.version }}' \
            --build-number='${{ github.run_number }}' \
            --obfuscate \
            --split-debug-info=build/symbols

      - name: Build signed Android App Bundle
        run: |
          flutter build appbundle \
            --release \
            --target-platform android-arm64 \
            --build-name='${{ steps.version.outputs.version }}' \
            --build-number='${{ github.run_number }}' \
            --obfuscate \
            --split-debug-info=build/symbols

      - name: Verify native libraries and APK signature
        shell: bash
        env:
          STORE_PASS: ${{ secrets.ARCPDF_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ARCPDF_KEY_ALIAS }}
        run: |
          set -euo pipefail

          apk='build/app/outputs/flutter-apk/app-release.apk'
          aab='build/app/outputs/bundle/release/app-release.aab'

          test -s "$apk"
          test -s "$aab"

          unzip -Z1 "$apk" > "$RUNNER_TEMP/apk-files.txt"

          for lib in \
            libarcpdf_indexer.so \
            libpdfium.so \
            libflutter.so; do

            if ! grep -Fxq \
              "lib/arm64-v8a/$lib" \
              "$RUNNER_TEMP/apk-files.txt"; then
              echo "::error::Missing native library $lib"
              exit 1
            fi
          done

          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          signer="$(find "$sdk/build-tools" \
            -type f -name apksigner | sort -V | tail -1)"

          test -n "$signer"

          "$signer" verify --verbose "$apk"

          expected="$(keytool -exportcert \
            -keystore "$ARCPDF_KEYSTORE_PATH" \
            -storepass "$STORE_PASS" \
            -alias "$KEY_ALIAS" | \
            sha256sum | cut -d' ' -f1)"

          actual="$("$signer" verify \
            --print-certs "$apk" | \
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | \
            head -1)"

          if [[ -z "$actual" || "$actual" != "$expected" ]]; then
            echo "::error::APK signing certificate mismatch"
            exit 1
          fi

          echo "APK, Rust, PDFium and signing verified"

      - name: Package release files
        shell: bash
        run: |
          set -euo pipefail

          tag='${{ steps.version.outputs.tag }}'

          mkdir -p release

          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            "release/ArcPDF-$tag-arm64-v8a.apk"

          cp \
            build/app/outputs/bundle/release/app-release.aab \
            "release/ArcPDF-$tag.aab"

          (
            cd release
            sha256sum *.apk *.aab > SHA256SUMS.txt
          )

          ls -lh release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ArcPDF-${{ steps.version.outputs.tag }}
          path: |
            release/*
            build/symbols/**
          if-no-files-found: error
          retention-days: 30

      - name: Commit manually bumped version
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'

          git add pubspec.yaml

          git commit -m \
            'chore: release ${{ steps.version.outputs.tag }} [skip ci]'

          git push origin HEAD:Main

      - name: Resolve release commit
        id: release_commit
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ steps.release_commit.outputs.sha }}
          name: ArcPDF ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          make_latest: ${{ github.event_name == 'workflow_dispatch' }}
          files: release/*
