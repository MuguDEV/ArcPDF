name: ArcPDF Release

# Jobs: build (compile, sign, package, upload), validate (verify checksums,
# native libraries and signing certificate on the packaged files), publish
# (version bump commit and GitHub Release). Publish needs both. Jobs run on
# different runners and hand files over as the ArcPDF-<tag> artifact.
# The release keystore is decoded only inside the job that needs it and is
# never uploaded.
#
# Cache mechanisms, one per category: Flutter (subosito/flutter-action),
# Gradle (gradle/actions/setup-gradle), Rust (Swatinem/rust-cache, one step caching
# .arc-build/cargo-target via cache-directories). setup-java has no cache. The three APK/AAB
# builds in the build job use identical flags apart from packaging mode, so
# Gradle and Cargo outputs are reused within the runner.
#
# Rust toolchain pin: 1.92.0, the compiler the committed Cargo.lock was last
# built and tested with (no rust-toolchain file exists in the repo).
# Bundletool decision: see docs/optimization/PHASE_02_PACKAGING.md.

on:
  push:
    branches:
      - Main

  workflow_dispatch:
    inputs:
      bump_type:
        description: Version bump type
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: arcpdf-auto-release
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: '1.92.0'

jobs:
  build:
    name: Build signed release files
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/Main' }}

      - name: Install Rust Android targets
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/arcpdf_indexer
          cache-directories: .arc-build/cargo-target
          shared-key: arcpdf-android
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/Main' }}

      - name: Determine version
        id: version
        shell: bash
        env:
          TRIGGER: ${{ github.event_name }}
          BUMP_TYPE: ${{ inputs.bump_type }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import pathlib
          import re

          file = pathlib.Path('pubspec.yaml')
          source = file.read_text()

          match = re.search(
              r'(?m)^version:\s*(\d+)\.(\d+)\.(\d+)(?:\+\d+)?\s*$',
              source
          )

          if not match:
              raise SystemExit('Invalid pubspec version')

          major, minor, patch = map(int, match.groups())
          manual = os.environ['TRIGGER'] == 'workflow_dispatch'

          if manual:
              bump = os.environ['BUMP_TYPE']

              if bump == 'major':
                  major, minor, patch = major + 1, 0, 0
              elif bump == 'minor':
                  minor, patch = minor + 1, 0
              elif bump == 'patch':
                  patch += 1
              else:
                  raise SystemExit('Invalid bump type')

          version = f'{major}.{minor}.{patch}'

          if manual:
              tag = f'v{version}'
              file.write_text(
                  source[:match.start()]
                  + f'version: {version}'
                  + source[match.end():]
              )
          else:
              tag = (
                  f"v{version}-build."
                  f"{os.environ['RUN_NUMBER']}"
              )

          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'version={version}\n')
              out.write(f'tag={tag}\n')

          pathlib.Path('release-tag.txt').write_text(tag)
          print(f'Release: {tag}')
          PY

          tag="$(cat release-tag.txt)"

          if git ls-remote --tags origin \
            "refs/tags/$tag" | \
            grep -Fq "refs/tags/$tag"; then
            echo "::error::Tag already exists"
            exit 1
          fi

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Set up Android SDK and Gradle workers
        shell: bash
        run: |
          set -euo pipefail

          tool/setup_android_sdk.sh
          tool/ci_gradle_workers.sh

          cargo metadata \
            --locked \
            --format-version 1 \
            --no-deps \
            --manifest-path native/arcpdf_indexer/Cargo.toml \
            > /dev/null

          rustup target list --installed

      - name: Configure production signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ARCPDF_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ARCPDF_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ARCPDF_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ARCPDF_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for key in KEYSTORE_B64 STORE_PASS KEY_ALIAS KEY_PASS; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing secret: $key"
              exit 1
            fi
          done

          keystore="$RUNNER_TEMP/arcpdf-release.jks"

          printf '%s' "$KEYSTORE_B64" | \
            base64 --decode > "$keystore"

          test -s "$keystore"

          keytool -list \
            -keystore "$keystore" \
            -storepass "$STORE_PASS" \
            -alias "$KEY_ALIAS" > /dev/null

          echo "::add-mask::$STORE_PASS"
          echo "::add-mask::$KEY_PASS"

          {
            echo "ARCPDF_KEYSTORE_PATH=$keystore"
            echo "ARCPDF_STORE_PASSWORD=$STORE_PASS"
            echo "ARCPDF_KEY_ALIAS=$KEY_ALIAS"
            echo "ARCPDF_KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"

          echo "Production signing configured"

      - name: Build signed universal APK
        shell: bash
        run: |
          set -euo pipefail

          flutter build apk \
            --release \
            --target-platform android-arm,android-arm64,android-x64 \
            --build-name='${{ steps.version.outputs.version }}' \
            --build-number='${{ github.run_number }}' \
            --obfuscate \
            --split-debug-info=build/symbols/universal

          mkdir -p build/universal

          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            build/universal/app-universal-release.apk

          test -s build/universal/app-universal-release.apk

      - name: Build signed per-ABI APKs
        shell: bash
        run: |
          set -euo pipefail

          flutter build apk \
            --release \
            --split-per-abi \
            --target-platform android-arm,android-arm64,android-x64 \
            --build-name='${{ steps.version.outputs.version }}' \
            --build-number='${{ github.run_number }}' \
            --obfuscate \
            --split-debug-info=build/symbols/split

      - name: Build signed Android App Bundle
        shell: bash
        run: |
          set -euo pipefail

          flutter build appbundle \
            --release \
            --target-platform android-arm,android-arm64,android-x64 \
            --build-name='${{ steps.version.outputs.version }}' \
            --build-number='${{ github.run_number }}' \
            --obfuscate \
            --split-debug-info=build/symbols/bundle

      - name: Package release files
        shell: bash
        run: |
          set -euo pipefail

          tag='${{ steps.version.outputs.tag }}'

          mkdir -p release

          cp \
            build/universal/app-universal-release.apk \
            "release/ArcPDF-$tag-universal.apk"

          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp \
              "build/app/outputs/flutter-apk/app-$abi-release.apk" \
              "release/ArcPDF-$tag-$abi.apk"
          done

          cp \
            build/app/outputs/bundle/release/app-release.aab \
            "release/ArcPDF-$tag.aab"

          (
            cd release
            sha256sum *.apk *.aab > SHA256SUMS.txt
          )

          ls -lh release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ArcPDF-${{ steps.version.outputs.tag }}
          path: |
            release/*
            build/symbols/**
          if-no-files-found: error
          retention-days: 30

  validate:
    name: Validate release files
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ArcPDF-${{ needs.build.outputs.tag }}
          path: .

      - name: Verify checksums
        shell: bash
        run: |
          set -euo pipefail
          (cd release && sha256sum --check --strict SHA256SUMS.txt)

      - name: Install pinned Android build-tools
        shell: bash
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/36.0.0"
          if [[ ! -x "$tools/apksigner" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;36.0.0' < <(yes) > /dev/null
          fi
          [[ -x "$tools/apksigner" ]] || { echo "::error::apksigner not found"; exit 1; }
          echo "ARCPDF_BUILD_TOOLS_DIR=$tools" >> "$GITHUB_ENV"

      - name: Load production keystore for certificate comparison
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ARCPDF_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ARCPDF_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ARCPDF_KEY_ALIAS }}
        run: |
          set -euo pipefail

          for key in KEYSTORE_B64 STORE_PASS KEY_ALIAS; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing secret: $key"
              exit 1
            fi
          done

          keystore="$RUNNER_TEMP/arcpdf-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$keystore"
          test -s "$keystore"
          echo "::add-mask::$STORE_PASS"
          echo "ARCPDF_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Verify native libraries and APK signatures
        shell: bash
        env:
          STORE_PASS: ${{ secrets.ARCPDF_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ARCPDF_KEY_ALIAS }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail

          aab="release/ArcPDF-$TAG.aab"

          test -s "$aab"

          signer="$ARCPDF_BUILD_TOOLS_DIR/apksigner"

          if [[ ! -x "$signer" ]]; then
            echo "::error::apksigner not found"
            exit 1
          fi

          expected="$(keytool -exportcert \
            -keystore "$ARCPDF_KEYSTORE_PATH" \
            -storepass "$STORE_PASS" \
            -alias "$KEY_ALIAS" |
            sha256sum |
            awk '{print $1}')"

          expected="$(
            printf '%s' "$expected" |
            tr '[:upper:]' '[:lower:]' |
            tr -d ':[:space:]'
          )"

          if [[ ! "$expected" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Invalid expected certificate digest"
            exit 1
          fi

          checks=(
            "release/ArcPDF-$TAG-universal.apk:arm64-v8a armeabi-v7a x86_64"
            "release/ArcPDF-$TAG-arm64-v8a.apk:arm64-v8a"
            "release/ArcPDF-$TAG-armeabi-v7a.apk:armeabi-v7a"
            "release/ArcPDF-$TAG-x86_64.apk:x86_64"
          )

          for entry in "${checks[@]}"; do
            apk="${entry%%:*}"
            abis="${entry#*:}"

            echo "========================================"
            echo "Verifying: $apk"

            if [[ ! -s "$apk" ]]; then
              echo "::error::Missing or empty APK: $apk"
              exit 1
            fi

            file_list="$RUNNER_TEMP/apk-files.txt"

            unzip -Z1 "$apk" > "$file_list"

            for abi in $abis; do
              for lib in \
                libarcpdf_indexer.so \
                libpdfium.so \
                libflutter.so; do

                if ! grep -Fxq \
                  "lib/$abi/$lib" \
                  "$file_list"; then

                  echo "::error::Missing $lib for $abi in $apk"
                  exit 1
                fi
              done
            done

            echo "Native libraries verified"

            "$signer" verify --verbose "$apk"

            cert_output="$("$signer" verify \
              --print-certs "$apk")"

            actual="$(
              printf '%s\n' "$cert_output" |
              sed -nE \
                's/^[[:space:]]*Signer #1 certificate SHA-256 digest:[[:space:]]*//p' |
              tr '[:upper:]' '[:lower:]' |
              tr -d ':[:space:]'
            )"

            if [[ ! "$actual" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::Unable to parse APK certificate digest"
              printf '%s\n' "$cert_output"
              exit 1
            fi

            echo "Expected SHA256: $expected"
            echo "Actual SHA256:   $actual"

            if [[ "$actual" != "$expected" ]]; then
              echo "::error::Signing certificate mismatch for $apk"
              exit 1
            fi

            echo "Signature verified: $apk"
          done

          echo "========================================"
          echo "All APKs, Rust, PDFium and signatures verified"

  publish:
    name: Publish GitHub Release
    needs: [build, validate]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.validate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ArcPDF-${{ needs.build.outputs.tag }}
          path: .

      - name: Verify checksums
        shell: bash
        run: |
          set -euo pipefail
          (cd release && sha256sum --check --strict SHA256SUMS.txt)

      - name: Ensure tag does not exist
        shell: bash
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail

          if git ls-remote --tags origin \
            "refs/tags/$TAG" | \
            grep -Fq "refs/tags/$TAG"; then
            echo "::error::Tag already exists"
            exit 1
          fi

      - name: Commit manually bumped version
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail

          # Same edit the build job applied before compiling.
          python3 - <<'PY'
          import os
          import pathlib
          import re

          file = pathlib.Path('pubspec.yaml')
          source = file.read_text()
          match = re.search(
              r'(?m)^version:\s*(\d+)\.(\d+)\.(\d+)(?:\+\d+)?\s*$',
              source
          )
          if not match:
              raise SystemExit('Invalid pubspec version')
          file.write_text(
              source[:match.start()]
              + f"version: {os.environ['VERSION']}"
              + source[match.end():]
          )
          PY

          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'

          git add pubspec.yaml

          git commit -m \
            "chore: release $TAG [skip ci]"

          git push origin HEAD:Main

      - name: Resolve release commit
        id: release_commit
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          target_commitish: ${{ steps.release_commit.outputs.sha }}
          name: ArcPDF ${{ needs.build.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          make_latest: ${{ github.event_name == 'workflow_dispatch' }}
          files: release/*
