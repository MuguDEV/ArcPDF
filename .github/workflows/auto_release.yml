name: ArcPDF Auto Release

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  versioning-and-build:
    name: Build Android and Manage Version
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.set_output.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Cache Flutter Pub Packages
        uses: actions/cache@v3
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Bump Version
        id: bump_version
        env:
          BUMP_TYPE: ${{ github.event.inputs.bump_type }}
        run: |
          # Only bump version if triggered manually (workflow_dispatch)
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION=$(grep '^version: ' pubspec.yaml | awk '{print $2}' | tr -d '\r')
            echo "Current version: $VERSION"

            # Strip build number suffix (e.g. +12) if present
            CLEAN_VERSION=$(echo "$VERSION" | cut -d+ -f1)
            BUILD_SUFFIX=$(echo "$VERSION" | cut -s -d+ -f2)

            IFS='.' read -r major minor patch <<< "$CLEAN_VERSION"

            if [ "$BUMP_TYPE" == "major" ]; then
              major=$((major + 1))
              minor=0
              patch=0
            elif [ "$BUMP_TYPE" == "minor" ]; then
              minor=$((minor + 1))
              patch=0
            else
              patch=$((patch + 1))
            fi

            NEW_VERSION="$major.$minor.$patch"
            if [ -n "$BUILD_SUFFIX" ]; then
              NEW_VERSION="$NEW_VERSION+$BUILD_SUFFIX"
            fi
            echo "New version: $NEW_VERSION"

            # Update pubspec.yaml
            sed -i "s/^version: .*/version: $NEW_VERSION/" pubspec.yaml
            echo "VERSION=$NEW_VERSION" >> $GITHUB_ENV
          else
            # For pushes to main, just extract the current version
            VERSION=$(grep '^version: ' pubspec.yaml | awk '{print $2}' | tr -d '\r')
            echo "Current version: $VERSION"
            echo "VERSION=$VERSION" >> $GITHUB_ENV
          fi

      - name: Commit Updated Version
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "chore: bump version to v${{ env.VERSION }} [skip ci]" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref }} || echo "Push failed"

      - name: Set Version Output
        id: set_output
        run: echo "version=${{ env.VERSION }}" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: check_tag
        run: |
          if git ls-remote --tags origin | grep -q "refs/tags/v${{ env.VERSION }}"; then
            echo "Tag v${{ env.VERSION }} already exists. Skipping release."
            echo "SKIP_RELEASE=true" >> $GITHUB_ENV
          else
            echo "SKIP_RELEASE=false" >> $GITHUB_ENV
          fi

      - name: Build Split APKs
        if: env.SKIP_RELEASE == 'false'
        run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/app/outputs/symbols

      - name: Build AppBundle
        if: env.SKIP_RELEASE == 'false'
        run: flutter build appbundle --release --obfuscate --split-debug-info=build/app/outputs/symbols

      - name: Rename & Organize Artifacts
        if: env.SKIP_RELEASE == 'false'
        run: |
          mkdir -p release

          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-release.apk "release/ArcPDF-v${{ env.VERSION }}-universal.apk"
          fi

          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "release/ArcPDF-v${{ env.VERSION }}-armeabi-v7a.apk" || true
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "release/ArcPDF-v${{ env.VERSION }}-arm64-v8a.apk" || true
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk "release/ArcPDF-v${{ env.VERSION }}-x86_64.apk" || true

          cp build/app/outputs/bundle/release/app-release.aab "release/ArcPDF-v${{ env.VERSION }}.aab" || true

      - name: Upload Artifacts
        if: env.SKIP_RELEASE == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: release/*

      - name: Create Git Tag
        if: env.SKIP_RELEASE == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$GITHUB_TOKEN" ]; then git remote set-url origin https://x-access-token:$GITHUB_TOKEN@github.com/${{ github.repository }}.git; fi
          git tag "v${{ env.VERSION }}" || echo "Tag creation failed"
          git push origin "v${{ env.VERSION }}" || echo "Push tag failed"

  release:
    name: Create GitHub Release
    needs: [versioning-and-build]
    if: success() && needs.versioning-and-build.outputs.release_version != ''
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-artifacts
          path: artifacts
          merge-multiple: true

      - name: Check for Artifacts
        id: check_artifacts
        run: |
          if [ ! -d "artifacts" ] || [ -z "$(ls -A artifacts)" ]; then
             echo "No artifacts found. Skipping release creation."
             echo "skip=true" >> $GITHUB_ENV
          else
             echo "skip=false" >> $GITHUB_ENV
          fi

      - name: Create ArcPDF Release
        if: env.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.versioning-and-build.outputs.release_version }}
          name: ArcPDF v${{ needs.versioning-and-build.outputs.release_version }}
          files: "artifacts/*"
          generate_release_notes: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-docs:
    name: Deploy Docs to GitHub Pages
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
