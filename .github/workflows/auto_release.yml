name: ArcPDF Auto Release

on:
  push:
    branches: [Main]
  workflow_dispatch:
    inputs:
      bump_type:
        description: Version bump
        type: choice
        required: true
        default: patch
        options: [patch, minor, major]

permissions:
  contents: write

concurrency:
  group: arcpdf-release
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/arcpdf_indexer
      - name: Determine version and release tag
        id: version
        env:
          EVENT: ${{ github.event_name }}
          BUMP: ${{ inputs.bump_type }}
          RUN: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          p = pathlib.Path('pubspec.yaml')
          s = p.read_text()
          m = re.search(r'(?m)^version: (\d+)\.(\d+)\.(\d+)(?:\+\d+)?$', s)
          if not m: raise SystemExit('Invalid pubspec version')
          a, b, c = map(int, m.groups())
          if os.environ['EVENT'] == 'workflow_dispatch':
              bump = os.environ['BUMP']
              if bump == 'major': a, b, c = a + 1, 0, 0
              elif bump == 'minor': b, c = b + 1, 0
              elif bump == 'patch': c += 1
              else: raise SystemExit('Invalid bump type')
          version = f'{a}.{b}.{c}'
          tag = f'v{version}' if os.environ['EVENT'] == 'workflow_dispatch' else f"v{version}-build.{os.environ['RUN']}"
          if os.environ['EVENT'] == 'workflow_dispatch':
              p.write_text(s[:m.start()] + f'version: {version}' + s[m.end():])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'version={version}\ntag={tag}\n')
          PY
          if git ls-remote --exit-code --tags origin "refs/tags/$(grep -oP '^tag=\K.*' "$GITHUB_OUTPUT" | tail -1)" >/dev/null 2>&1; then
            echo 'Tag already exists'; exit 1
          fi
      - name: Fetch Flutter packages
        run: flutter pub get
      - name: Prepare Rust and Android NDK
        run: |
          flutter precache --android
          sdkmanager --install "ndk;28.2.13676358"
          cargo metadata --locked --format-version 1 --no-deps --manifest-path native/arcpdf_indexer/Cargo.toml >/dev/null
      - name: Configure production signing
        env:
          B64: ${{ secrets.ARCPDF_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ARCPDF_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ARCPDF_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ARCPDF_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for var in B64 STORE_PASS ALIAS KEY_PASS; do
            if [ -z "${!var}" ]; then echo "::error::Missing signing secret $var"; exit 1; fi
          done
          printf '%s' "$B64" | base64 -d > "$RUNNER_TEMP/arcpdf-release.jks"
          echo "ARCPDF_KEYSTORE_PATH=$RUNNER_TEMP/arcpdf-release.jks" >> "$GITHUB_ENV"
          echo "::add-mask::$STORE_PASS"
          echo "::add-mask::$KEY_PASS"
          echo "ARCPDF_STORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
          echo "ARCPDF_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"
          echo "ARCPDF_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
      - name: Build ARM64 release APK
        run: flutter build apk --release --target-platform android-arm64 --build-name="${{ steps.version.outputs.version }}" --build-number="${{ github.run_number }}" --obfuscate --split-debug-info=build/symbols
      - name: Build ARM64 AAB
        run: flutter build appbundle --release --target-platform android-arm64 --build-name="${{ steps.version.outputs.version }}" --build-number="${{ github.run_number }}" --obfuscate --split-debug-info=build/symbols
      - name: Check bundled native libraries
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          unzip -Z1 "$APK" | grep -Fx 'lib/arm64-v8a/libarcpdf_indexer.so'
          unzip -Z1 "$APK" | grep -Fx 'lib/arm64-v8a/libpdfium.so'
          unzip -Z1 "$APK" | grep -Fx 'lib/arm64-v8a/libflutter.so'
          test -s build/app/outputs/bundle/release/app-release.aab
          mkdir -p release
          cp "$APK" "release/ArcPDF-${{ steps.version.outputs.tag }}-arm64-v8a.apk"
          cp build/app/outputs/bundle/release/app-release.aab "release/ArcPDF-${{ steps.version.outputs.tag }}.aab"
          (cd release && sha256sum * > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: ArcPDF-${{ steps.version.outputs.tag }}
          path: |
            release/*
            build/symbols/**
          if-no-files-found: error
      - name: Save manually bumped version
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pubspec.yaml
          git commit -m "chore: release ${{ steps.version.outputs.tag }} [skip ci]"
          git push origin HEAD:Main
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: Main
          name: ArcPDF ${{ steps.version.outputs.tag }}
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: ${{ github.event_name == 'workflow_dispatch' }}
